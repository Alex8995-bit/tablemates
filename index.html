<script>
// L'app resta ferma come un'app: niente pizzico per ingrandire, niente doppio tocco che zooma
(function(){ var b = function (e) { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, b, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
<script>
// Intro all'avvio e quando si riapre l'app dopo un po'. Finché gira, PIN e Face ID aspettano (window.INTRO.fine).
(function(){
  var modello = document.getElementById('intro').outerHTML, chiudiFine = null, nascosta = 0;
  var I = window.INTRO = { attiva: false, fine: Promise.resolve() };
  function avvia(e) {
    I.attiva = true; I.fine = new Promise(function (r) { chiudiFine = r; });
    var fatto = false, via = function () { if (fatto) return; fatto = true; e.classList.add('esce'); setTimeout(function () { e.remove(); I.attiva = false; chiudiFine(); }, 500); };
    // l'intro dura sempre quanto serve all'animazione, anche con "Riduci movimento" attivo sull'iPhone (un tocco la salta)
    setTimeout(via, 5300); e.addEventListener('click', via);
  }
  I.mostra = function () { if (document.getElementById('intro') || I.salta) return; document.body.insertAdjacentHTML('afterbegin', modello); avvia(document.getElementById('intro')); };
  // riaperta dopo almeno 10 minuti in secondo piano: è come un nuovo avvio
  document.addEventListener('visibilitychange', function () { if (document.hidden) { nascosta = Date.now(); return; } if (nascosta && Date.now() - nascosta >= 600000) I.mostra(); });
  var e = document.getElementById('intro');
  // l'intro parte a ogni apertura dell'app (solo i test la saltano)
  try { if (sessionStorage.getItem('introVista') === 'test') { I.salta = true; e.remove(); return; } } catch (x) {}
  avvia(e);
})();
</script>
